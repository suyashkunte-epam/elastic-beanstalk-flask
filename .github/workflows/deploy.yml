name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Zip application
        run: zip -r deploy.zip application.py requirements.txt

      - name: Upload to S3
        run: |
          aws s3 cp deploy.zip s3://elasticbeanstalk-us-east-1-890742610830/deploy.zip

      - name: Create new Elastic Beanstalk version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name cmtr-2mdks171-app \
            --version-label "v-${{ github.run_number }}" \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-1-890742610830",S3Key="deploy.zip" \
            --region us-east-1

      - name: Deploy to Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name cmtr-2mdks171-app \
            --environment-name cmtr-2mdks171-env \
            --version-label "v-${{ github.run_number }}" \
            --region us-east-1
